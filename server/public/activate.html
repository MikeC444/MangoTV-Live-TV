<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to MangoTV</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0c0c10;
        color: #f6f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.3px;
        background: linear-gradient(90deg, #ffb020, #ff3d68);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #subtitle {
        margin: 0 0 24px;
        color: #afafb8;
        line-height: 1.4;
      }
      #tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        flex: 1;
        padding: 12px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 10px;
        border: 1px solid #333;
        background: #16161a;
        color: #afafb8;
        cursor: pointer;
      }
      .tab.active {
        border-color: transparent;
        background: linear-gradient(90deg, #ffb020, #ff3d68);
        color: #08080a;
      }
      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #333;
        background: #1c1c20;
        color: #fff;
      }
      input:focus {
        outline: 2px solid #ffb020;
        outline-offset: 1px;
      }
      button[type="submit"] {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 10px;
        border: none;
        background: linear-gradient(90deg, #ffb020, #ff3d68);
        color: #08080a;
        cursor: pointer;
      }
      button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #message {
        min-height: 20px;
        margin-top: 16px;
        line-height: 1.5;
        color: #afafb8;
      }
      #message.error {
        color: #ff6b6b;
      }
      #message.success {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MangoTV</h1>
      <p id="subtitle">Sign in to connect your Fire TV.</p>

      <div id="tabs">
        <button type="button" id="tab-login" class="tab active">Sign In</button>
        <button type="button" id="tab-register" class="tab">Create Account</button>
      </div>

      <form id="form">
        <input type="email" id="email" placeholder="Email" required autocomplete="email" />
        <input type="text" id="displayName" placeholder="Display name (optional)" style="display: none" />
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password" minlength="8" />
        <button type="submit" id="submit">Sign In</button>
      </form>

      <p id="message" role="status"></p>
    </main>
    <script src="/activate.js"></script>
  </body>
</html>
