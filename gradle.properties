org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Live TV configuration -- see README.md "Configuring Live TV" and
# docs/LIVE_TV_BACKEND.md. This file is committed to git, so only defaults
# live here (the public iptv-org playlist). To point at your own backend,
# checkout page, EPG source, or a licensed playlist, set the same keys in
# local.properties instead (gitignored, never committed):
#   IPTV_PLAYLIST_URL=https://iptv-org.github.io/iptv/index.m3u
#   LIVE_TV_ALLOWED_GROUPS=
#   EPG_URL=
#   API_BASE_URL=
#   PREMIUM_CHECKOUT_URL=
#   LIVE_TV_SKIP_PAYWALL=true
# None of these are secrets (they're just URLs, plus one boolean) -- real
# payment credentials/API keys belong on the backend only and must never be
# added to either of these files.
#
# LIVE_TV_SKIP_PAYWALL defaults to true (skips entitlement checks so Live TV
# unlocks for everyone) so channel browsing/playback can be tested before a
# real payment backend exists -- set it to false once ready to test/ship the
# real paywall.
